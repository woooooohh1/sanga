  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/png" sizes="192x192" href="../assets/images/favicon-192.png">

  <link rel="stylesheet" href="admin.css?v=13.4">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/supabase-config.js?v=2"></script>
  <script src="auth.js?v=2"></script>
</head>
<body>
<div class="admin-shell">
  
<aside class="admin-sidebar" id="adminSidebar">
  <a class="admin-brand" href="index.html">
    <img src="../assets/images/sanga-symbol-512.png" alt="">
    <span><strong>상아컴퓨터학원</strong><span>관리자 페이지</span></span>
  </a>
  <nav class="admin-nav" aria-label="관리자 메뉴">
    <a class="" href="index.html"><span class="nav-icon">▦</span>대시보드</a>
<a class="" href="courses.html"><span class="nav-icon">▤</span>수강과정 관리</a>
<a class="active" href="notices.html"><span class="nav-icon">◫</span>공지사항 관리</a>
<a class="" href="jobs.html"><span class="nav-icon">▣</span>취업정보 관리</a>
<a class="" href="history.html"><span class="nav-icon">◷</span>학원연혁 관리</a>
<a class="" href="inquiries.html"><span class="nav-icon">◌</span>상담신청 관리</a>
  </nav>
  <div class="admin-sidebar-bottom">
    <a class="admin-nav-link" href="../index.html" target="_blank" rel="noopener" style="color:#c9d2df;font-size:13px">↗ 홈페이지 보기</a>
    <br><br>
    
  </div>
</aside>


  <div class="admin-main">
    <header class="admin-topbar">
      <div class="admin-topbar-left">
        <button class="admin-mobile-toggle" id="adminMobileToggle" type="button" aria-label="관리자 메뉴 열기">☰</button>
        <strong>공지사항 관리</strong>
      </div>
      <div class="admin-user">
        <div class="admin-user-avatar">관</div>
        <div><strong>관리자</strong><small>Administrator</small></div>
        <button class="admin-logout-btn" type="button" data-admin-logout>로그아웃</button>
      </div>
    </header>

    <main class="admin-content">
      
<section class="page-title">
  <div><h1>공지사항 관리</h1><p>공지사항을 등록하고 게시 여부를 관리합니다.</p></div>
  <button class="btn btn-primary" id="addNoticeBtn" type="button">+ 공지 등록</button>
</section>

<div class="admin-card form-panel">
  <div class="toolbar search-toolbar">
    <select id="noticeStatusFilter" aria-label="공지 상태">
      <option value="">전체 상태</option>
      <option value="게시">게시</option>
      <option value="임시저장">임시저장</option>
    </select>
    <input id="noticeSearch" type="search" placeholder="공지 제목 · 내용 검색" aria-label="공지 검색">
    <button class="btn btn-outline filter-reset" type="button" data-reset-filters="notices">초기화</button>
  </div>
  <!-- [DB/API 연동 지점] GET /api/admin/notices -->
  <div class="table-wrap">
    <table class="admin-table">
      <thead><tr><th>번호</th><th>제목</th><th>상태</th><th>등록일</th><th>조회수</th><th>관리</th></tr></thead>
      <tbody id="noticeTableBody"></tbody>
    </table>
  </div>
</div>

<div class="admin-modal" id="noticeModal">
  <div class="admin-modal-card">
    <div class="admin-modal-head"><h2 id="noticeModalTitle">새 항목 등록</h2><button class="modal-close" data-close="noticeModal" type="button">✕</button></div>
    <form id="noticeForm">
      <input type="hidden" name="id" id="noticeId">
      <div class="form-grid">
        <div class="form-field full"><label>제목</label><input name="title" required></div>
        <div class="form-field"><label>게시상태</label><select name="status"><option>게시</option><option>임시저장</option></select></div>
        <div class="form-field"><label>등록일</label><input name="date" type="date" required></div>
        <div class="form-field full"><label>내용</label><textarea name="content" required></textarea></div>
        <input type="hidden" name="views" value="0">
      </div>
      <div class="form-actions"><button class="btn btn-primary" type="submit">저장</button></div>
    </form>
  </div>
</div>

    </main>
  </div>
</div>

<div class="admin-toast" id="adminToast" role="status" aria-live="polite"></div>
<script src="admin-controls.js?v=13.4"></script>
<script src="admin.js?v=13.0"></script>
</body>
</html>
