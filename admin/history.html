<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>학원연혁 관리 | 상아컴퓨터학원 관리자</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/images/favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png">
  <link rel="stylesheet" href="admin.css?v=12.6">
  <script src="auth.js"></script>
</head>
<body>
<div class="admin-shell">
  
<aside class="admin-sidebar" id="adminSidebar">
  <a class="admin-brand" href="index.html">
    <img src="../assets/images/sanga-symbol-512.png" alt="">
    <span><strong>상아컴퓨터학원</strong><span>관리자 페이지</span></span>
  </a>
  <nav class="admin-nav" aria-label="관리자 메뉴">
    <a class="" href="index.html"><span class="nav-icon">▦</span>대시보드</a>
<a class="" href="courses.html"><span class="nav-icon">▤</span>수강과정 관리</a>
<a class="" href="notices.html"><span class="nav-icon">◫</span>공지사항 관리</a>
<a class="" href="jobs.html"><span class="nav-icon">▣</span>취업정보 관리</a>
<a class="active" href="history.html"><span class="nav-icon">◷</span>학원연혁 관리</a>
<a class="" href="inquiries.html"><span class="nav-icon">◌</span>상담신청 관리</a>
  </nav>
  <div class="admin-sidebar-bottom">
    <a class="admin-nav-link" href="../index.html" target="_blank" rel="noopener" style="color:#c9d2df;font-size:13px">↗ 홈페이지 보기</a>
    <br><br>
    <button class="btn btn-outline" style="width:100%" type="button" data-reset-demo>데모데이터 초기화</button>
  </div>
</aside>


  <div class="admin-main">
    <header class="admin-topbar">
      <div class="admin-topbar-left">
        <button class="admin-mobile-toggle" id="adminMobileToggle" type="button" aria-label="관리자 메뉴 열기">☰</button>
        <strong>학원연혁 관리</strong>
      </div>
      <div class="admin-user">
        <div class="admin-user-avatar">관</div>
        <div><strong>관리자</strong><small>Administrator</small></div>
        <button class="admin-logout-btn" type="button" data-admin-logout>로그아웃</button>
      </div>
    </header>

    <main class="admin-content">
      
<section class="page-title">
  <div><h1>학원연혁 관리</h1><p>학원소개 페이지의 타임라인 내용을 관리합니다.</p></div>
  <button class="btn btn-primary" id="addHistoryBtn" type="button">+ 연혁 추가</button>
</section>

<div class="admin-card form-panel">
  <div class="toolbar search-toolbar">
    <input id="historyYearFilter" type="search" inputmode="numeric" placeholder="연도 검색" aria-label="연혁 연도 검색">
    <input id="historySearch" type="search" placeholder="태그 · 제목 · 설명 검색" aria-label="연혁 검색">
    <button class="btn btn-outline filter-reset" type="button" data-reset-filters="history">초기화</button>
  </div>
  <!-- [DB/API 연동 지점] GET /api/admin/history -->
  <div class="table-wrap">
    <table class="admin-table">
      <thead><tr><th>ID</th><th>연도</th><th>태그</th><th>제목</th><th>관리</th></tr></thead>
      <tbody id="historyTableBody"></tbody>
    </table>
  </div>
</div>

<div class="admin-modal" id="historyModal">
  <div class="admin-modal-card">
    <div class="admin-modal-head"><h2 id="historyModalTitle">새 항목 등록</h2><button class="modal-close" data-close="historyModal" type="button">✕</button></div>
    <form id="historyForm">
      <input type="hidden" name="id" id="historyId">
      <div class="form-grid">
        <div class="form-field"><label>연도</label><input name="year" required placeholder="2026 / NOW"></div>
        <div class="form-field"><label>태그</label><input name="tag" placeholder="GROWTH"></div>
        <div class="form-field full"><label>제목</label><input name="title" required></div>
        <div class="form-field full"><label>설명</label><textarea name="description" required></textarea></div>
      </div>
      <div class="form-actions"><button class="btn btn-primary" type="submit">저장</button></div>
    </form>
  </div>
</div>

    </main>
  </div>
</div>

<div class="admin-toast" id="adminToast" role="status" aria-live="polite"></div>
<script src="admin.js?v=12.4"></script>
</body>
</html>
